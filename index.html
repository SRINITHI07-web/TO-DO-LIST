<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <h1>My To-Do List</h1>

      <form id="todo-form" class="todo-form">
        <input id="new-task" type="text" placeholder="Add a new task" aria-label="Task name" />
        <button id="add-btn" type="submit">Add</button>
      </form>
      <p id="notification" class="notification" role="status" aria-live="polite"></p>

      <div class="filters" aria-label="Task filters">
        <button class="filter-btn active" data-filter="all" type="button">All</button>
        <button class="filter-btn" data-filter="active" type="button">Active</button>
        <button class="filter-btn" data-filter="completed" type="button">Completed</button>
      </div>

      <ul id="task-list" class="task-list" aria-live="polite"></ul>
    </div>

    <script src="script.js"></script>
  </body>
</html>
